<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synchronous Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .user-card {
        border: 1px solid #ccc;
        padding: 15px;
        width: 300px;
        border-radius: 8px;
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
      }
      .user-card img {
        width: 100px;
        border-radius: 50%;
      }
      #user {
        margin-top: 20px;
      } 
    </style>
  </head>
  <body>
    <h1>GitHub User Details</h1>
    <div id="user"></div>

    <script>
      async function loaduserdetails(username) {
        const userDiv = document.getElementById("user");
        userDiv.innerHTML = "<p>Loading...</p>";
        try {
          const url = `https://api.github.com/users/${username}`;
          const res = await fetch(url);

          if (!res.ok) {
            throw new Error(`Error ${res.status}: ${res.statusText}`);
          }
          const data = await res.json();

          userDiv.innerHTML = `
          <div class="user-card">
            <img src="${data.avatar_url}" alt="Avatar">
            <h2>${data.login}</h2>
            <p><strong>Name:</strong> ${data.name || "N/A"}</p>
            <p><strong>Bio:</strong> ${data.bio || "No bio available"}</p>
            <p><strong>Public Repos:</strong> ${data.public_repos}</p>
            <p><strong>Followers:</strong> ${data.followers}</p>
            <p><a href="${data.html_url}" target="_blank">View Profile</a></p>
          </div>
        `;
        } catch (err) {
          userDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
        }
      }
      loaduserdetails("Naivete07");
    </script>
  </body>
</html>
